<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Re:Start A:Gain? // Precision Platformer</title>
  <style>
    :root {
      --bg: #07090e;
      --cyan: #00f0ff;
      --crimson: #ff4655;
      --gold: #ffb800;
      --white: #f1f5f9;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), 0 0 2px var(--cyan);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    canvas#game-canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.28) 50%,
        rgba(0, 0, 0, 0.28)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    /* Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 11;
    }

    #controls-bar {
      margin-top: 14px;
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .key-badge {
      display: inline-block;
      padding: 2px 7px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      color: var(--cyan);
      font-weight: 700;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="480" height="270"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div id="controls-bar">
    <div><span class="key-badge">A / D</span> or <span class="key-badge">← / →</span> MOVE</div>
    <div><span class="key-badge">SPACE</span> / <span class="key-badge">Z</span> JUMP (WALL-KICK)</div>
    <div><span class="key-badge">SHIFT</span> / <span class="key-badge">X</span> 8-WAY DASH</div>
    <div><span class="key-badge">R</span> RESTART</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
